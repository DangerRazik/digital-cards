# Replace example domains and certificate paths before enabling.
# Backend listens ONLY on 127.0.0.1:3000, behind this local Nginx.
server {
    listen 80;
    server_name admin.cards.example.ru card.example.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name admin.cards.example.ru;
    ssl_certificate /etc/letsencrypt/live/admin.cards.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cards.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/digital-cards/admin-web/dist/admin-cards/browser;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 443 ssl;
    server_name card.example.ru;
    ssl_certificate /etc/letsencrypt/live/card.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/card.example.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/digital-cards/public-web/dist/public-card/browser;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/public/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
