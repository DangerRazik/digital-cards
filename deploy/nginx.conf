# Internal testing only. Confirm ports 8081/8082 and permitted client networks.
# Bind only to the server's private IP.
server {
    listen 10.3.237.134:8081;
    server_name 10.3.237.134;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    root /opt/digital-cards/admin-web/dist/admin-cards/browser;
    index index.html;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 10.3.237.134:8082;
    server_name 10.3.237.134;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    root /opt/digital-cards/public-web/dist/public-card/browser;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/public/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location /api/ { return 404; }
    location ~ /\. { deny all; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location / { try_files $uri $uri/ /index.html; }
}
