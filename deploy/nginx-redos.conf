# Standalone config for digital-cards-web.service on 10.11.131.69.
# TLS terminates on 10.11.131.70. Do not include this in nginx.conf.
user nginx;
worker_processes auto;
pid /run/digital-cards-web.pid;
error_log /var/log/nginx/digital-cards-error.log;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/digital-cards-access.log;
    server_tokens off;

    # The edge proxy must overwrite X-Real-IP with the actual client address.
    # Do not use real_ip_header here: access rules must check the proxy's socket IP.
    map $remote_addr $cards_client_ip {
        default $remote_addr;
        10.11.131.70 $http_x_real_ip;
    }

    server {
        listen 10.11.131.69:8081;
        server_name cards.citrt.ru;
        allow 10.11.131.70;
        allow 10.11.131.69;
        deny all;

        root /opt/digital-cards/public-web/dist/public-card/browser;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/public/ {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host cards.citrt.ru;
            proxy_set_header X-Real-IP $cards_client_ip;
            proxy_set_header X-Forwarded-For $cards_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location /api/ { return 404; }
        location ~ /\. { deny all; }
        location = /index.html { expires -1; }
        location / { try_files $uri $uri/ /index.html; }
    }

    server {
        listen 10.11.131.69:8082;
        server_name cardsadmin.citrt.ru;
        allow 10.11.131.70;
        allow 10.11.131.69;
        deny all;

        root /opt/digital-cards/admin-web/dist/admin-cards/browser;
        index index.html;
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        location /api/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host cardsadmin.citrt.ru;
            proxy_set_header X-Real-IP $cards_client_ip;
            proxy_set_header X-Forwarded-For $cards_client_ip;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
        location ~ /\. { deny all; }
        location = /index.html { expires -1; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
